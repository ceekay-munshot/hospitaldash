name: BSE metric extraction (OpenAI / Gemini)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM provider. openai = paid (gpt-4o-mini, ~$0.003/PDF, generous limits). gemini = free tier (low quota).'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - gemini
      max_extractions:
        description: 'Max PDFs to extract this run.'
        required: false
        default: '300'
      model:
        description: 'Model override (optional). For Gemini: gemini-2.5-flash-lite. For OpenAI: gpt-4o-mini.'
        required: false
        default: ''
      call_delay_ms:
        description: 'Delay between calls in ms. Lower = faster but watch RPM.'
        required: false
        default: '2000'
  schedule:
    # 30 min after scrape (scrape is at 14:00 UTC)
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: bse-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    # 180 min headroom — first backfill across 11 cos with deep history takes
    # >90 min on OpenAI text-based extraction. Cron runs do near-zero work
    # (cache hits), so this only kicks in for the rare big backfill day.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest (in case scrape just committed)
        run: git pull --rebase origin main || true

      - name: Install root deps (pdf-parse for OpenAI text extraction)
        run: npm install --no-audit --no-fund

      - name: Run extraction
        env:
          LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ github.event.inputs.model || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash-lite' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ github.event.inputs.max_extractions || '60' }}
          GEMINI_CALL_DELAY_MS: ${{ github.event.inputs.call_delay_ms || '2000' }}
        run: node scripts/extract-metrics.mjs

      # Rebuild merged metrics + sector dataset whenever extraction ran (even partially).
      # Pure local processing — no API calls, always runs.
      - name: Build per-company metrics
        if: always()
        run: node scripts/build-metrics.mjs

      - name: Build sector dataset
        if: always()
        run: node scripts/build-sector.mjs

      # CRITICAL: always commit progress, even if extraction step crashed/timed out.
      # The script writes to disk after every extraction; we never want to lose it.
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extracted/*.json data/metrics/*.json data/sector.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(data): refresh extracted metrics + sector dataset"
            git pull --rebase origin main || true
            git push
          fi
