name: BSE metric extraction (Gemini)

on:
  workflow_dispatch:
    inputs:
      max_extractions:
        description: 'Max PDFs to extract this run (Gemini quota budget). Lower = safer.'
        required: false
        default: '40'
      model:
        description: 'Gemini model to use (gemini-2.5-flash recommended).'
        required: false
        default: 'gemini-2.5-flash'
      call_delay_ms:
        description: 'Delay between Gemini calls in ms (keeps us under 15 RPM).'
        required: false
        default: '4500'
  schedule:
    # 30 min after scrape (scrape is at 14:00 UTC)
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: bse-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest (in case scrape just committed)
        run: git pull --rebase origin main || true

      - name: Run Gemini extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash' }}
          MAX_EXTRACTIONS_PER_RUN: ${{ github.event.inputs.max_extractions || '25' }}
          GEMINI_CALL_DELAY_MS: ${{ github.event.inputs.call_delay_ms || '4500' }}
        run: node scripts/extract-metrics.mjs

      # Rebuild merged metrics + sector dataset whenever extraction ran (even partially).
      # Pure local processing — no API calls, always runs.
      - name: Build per-company metrics
        if: always()
        run: node scripts/build-metrics.mjs

      - name: Build sector dataset
        if: always()
        run: node scripts/build-sector.mjs

      # CRITICAL: always commit progress, even if extraction step crashed/timed out.
      # The script writes to disk after every extraction; we never want to lose it.
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extracted/*.json data/metrics/*.json data/sector.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(data): refresh extracted metrics + sector dataset"
            git pull --rebase origin main || true
            git push
          fi
