name: BSE scrape

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Date window for filings (days). Default 90; bump for backfill.'
        required: false
        default: '90'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

concurrency:
  group: bse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape filings (all companies)
        env:
          BSE_WINDOW_DAYS: ${{ github.event.inputs.window_days || '90' }}
        run: node scripts/scrape-bse-company.mjs --all

      - name: Scrape quotes (all companies)
        run: node scripts/scrape-bse-quotes.mjs --all

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bse-*.json data/quotes/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh BSE filings + quotes"
            git push
          fi
