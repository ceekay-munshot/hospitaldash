name: BSE scrape

on:
  workflow_dispatch:
    inputs:
      scrip:
        description: '6-digit BSE scrip code'
        required: true
        default: '508869'
      slug:
        description: 'slug for output filename (data/bse-<slug>.json)'
        required: true
        default: 'apollo-hospitals'
  schedule:
    - cron: '0 1,14 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        env:
          SCRIP: ${{ github.event.inputs.scrip || '508869' }}
          SLUG: ${{ github.event.inputs.slug || 'apollo-hospitals' }}
        run: node scripts/scrape-bse-company.mjs "$SCRIP" "$SLUG"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bse-*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh BSE snapshot"
            git push
          fi
