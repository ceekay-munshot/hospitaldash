name: Deploy dashboard (GH Pages)

on:
  push:
    branches: [main]
    paths:
      - 'data/sector.json'
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Copy sector data into public/
        run: |
          mkdir -p dashboard/public
          cp data/sector.json dashboard/public/sector.json
          echo "sector.json: $(wc -c < dashboard/public/sector.json) bytes"

      - name: Build
        working-directory: dashboard
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4
